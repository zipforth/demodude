name: build-and-package

on:
  pull_request:
    branches:
      - master
    types: closed
    
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  
jobs:
  approved:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: change case of account/repo
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_NAME }}
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.lowercase }}
          
      - name: Generate new version
        id: new_version
        run: |
          type_of_pr=$(gh pr list --state merged --base master --json labels | jq '.[0].labels[0].name')
          version=$(gh release list -L 1 --json tagName | jq ' .[0].tagName ')
          version=${version:2:-1}
          type_of_pr="${type_of_pr:1:-1}"
          echo "$type_of_pr"
          IFS="." read -ra ADDR <<< "$version"
          breaking=${ADDR[0]}
          feat=${ADDR[1]}
          patch=${ADDR[2]}
          echo "${breaking} ${feat} ${patch}"
          case "$type_of_pr" in
                  "bug")
                          patch=$(( patch + 1 ))
                  ;;
                  "feat")
                          feat=$(( feat + 1 ))
                          patch=0
                  ;;
                  "breaking")
                          breaking=$(( breaking + 1 ))
                          patch=0
                          feat=0
                  ;;
          esac
          new_ver="v${breaking}.${feat}.${patch}"
          echo "$new_ver"
          echo "NEW_VER=$new_ver" >> $GITHUB_OUTPUT

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0



      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        run: |
          docker buildx build --push -t ${{env.REGISTRY}}/${{steps.image.outputs.lowercase}}:${{steps.new_version.outputs.NEW_VER}} --cache-to type=gha,mode=max --cache-from type=gha .

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      
      - name: Create a release to match the package
        run: |
          gh release create ${{steps.new_version.outputs.NEW_VER}} --generate-notes
